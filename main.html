<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智控电商 · 运营后台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #eef2f8;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 220px;
            background: #0a1e2f;
            color: #b8cfe0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 20px rgba(10, 30, 47, 0.08);
            z-index: 100;
        }
        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        .sidebar .logo {
            padding: 22px 20px 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .logo i {
            font-size: 26px;
            color: #4dabf7;
            background: rgba(77, 171, 247, 0.12);
            padding: 8px;
            border-radius: 12px;
        }
        .sidebar .logo span {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }
        .sidebar .logo .badge {
            font-size: 10px;
            background: #4dabf7;
            color: #0a1e2f;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 600;
            margin-left: auto;
        }
        .sidebar .nav { flex: 1; padding: 16px 12px 20px; }
        .sidebar .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #5a7f99;
            padding: 14px 12px 6px;
            font-weight: 600;
        }
        .sidebar .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            color: #9bb4cc;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            margin-bottom: 2px;
            position: relative;
        }
        .sidebar .item i {
            width: 18px;
            font-size: 15px;
            text-align: center;
            color: #5a7f99;
        }
        .sidebar .item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #d4e4f0;
        }
        .sidebar .item:hover i { color: #7aaed9; }
        .sidebar .item.active {
            background: rgba(77, 171, 247, 0.12);
            color: #fff;
        }
        .sidebar .item.active i { color: #4dabf7; }
        .sidebar .item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 3px;
            background: #4dabf7;
            border-radius: 0 4px 4px 0;
        }
        .sidebar .item .tag {
            margin-left: auto;
            background: rgba(77, 171, 247, 0.15);
            color: #4dabf7;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 600;
        }
        .sidebar .bottom {
            padding: 16px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            color: #5a7f99;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== 主内容区 ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh;
        }
        .topbar {
            background: #fff;
            padding: 14px 28px;
            border-bottom: 1px solid #e8edf4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .topbar .left h2 {
            font-size: 18px;
            font-weight: 600;
            color: #0a1e2f;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar .left p {
            font-size: 12px;
            color: #5f7d95;
            margin-top: 2px;
        }
        .topbar .right {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .topbar .right .btn {
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #dce5ef;
            background: #fff;
            font-size: 13px;
            font-weight: 500;
            color: #1e3a5f;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.1s;
        }
        .topbar .right .btn:hover {
            background: #f5f9fe;
            border-color: #4dabf7;
        }
        .topbar .right .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #4dabf7;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
        }

        /* ===== iframe ===== */
        .content-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: #eef2f8;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar .logo span,
            .sidebar .logo .badge,
            .sidebar .item span,
            .sidebar .section-label,
            .sidebar .bottom span,
            .sidebar .item .tag { display: none; }
            .sidebar .logo { padding: 16px 12px; justify-content: center; }
            .sidebar .item { justify-content: center; padding: 12px; }
            .topbar { padding: 12px 16px; }
            .topbar .left h2 { font-size: 15px; }
        }
    </style>
</head>
<body>

<!-- ===== 左侧导航 ===== -->
<div class="sidebar">
    <div class="logo">
        <i class="fas fa-bolt"></i>
        <span>智控电商</span>
        <span class="badge">v3.0</span>
    </div>
    <div class="nav">
        <div class="section-label">经营总览</div>
        <!-- 注意：data-page 直接指向根目录原文件，没有 pages/ 前缀 -->
        <div class="item active"
             data-page="ai_assistant.html"
             data-title="AI 助手"
             data-desc="自然语言驱动的经营操作">
            <i class="fas fa-robot"></i><span>AI 助手</span>
        </div>
        <div class="item"
             data-page="images.html"
             data-title="图片素材"
             data-desc="素材管理 · AI 生成">
            <i class="fas fa-images"></i><span>图片素材</span>
        </div>
        <div class="item"
             data-page="logs.html"
             data-title="操作日志"
             data-desc="系统操作记录审计">
            <i class="fas fa-history"></i><span>操作日志</span>
        </div>

        <div class="section-label">商品与交易</div>
        <div class="item"
             data-page="商品管理.html"
             data-title="商品管理"
             data-desc="跨平台商品发布 · 库存同步">
            <i class="fas fa-box"></i><span>商品管理</span>
        </div>

        <div class="section-label">运营支持</div>
        <div class="item"
             data-page="素材生成.html"
             data-title="素材生成"
             data-desc="AI 生成商品主图 / 详情 / 视频">
            <i class="fas fa-magic"></i><span>素材生成</span>
        </div>
        <div class="item"
             data-page="渠道货源.html"
             data-title="渠道货源"
             data-desc="1688 / 供应链选品 · 一键铺货">
            <i class="fas fa-plug"></i><span>渠道货源</span>
        </div>
        <div class="item"
             data-page="智能采购系统.html"
             data-title="智能采购"
             data-desc="AI 驱动的采购决策">
            <i class="fas fa-cart-plus"></i><span>智能采购</span>
        </div>
        <div class="item"
             data-page="智能物流管理.html"
             data-title="智能物流"
             data-desc="全链路物流追踪 · 智能调度">
            <i class="fas fa-truck"></i><span>智能物流</span>
        </div>
    </div>
    <div class="bottom">
        <i class="fas fa-shield-alt"></i>
        <span>数据加密 · 安全</span>
    </div>
</div>

<!-- ===== 主内容区 ===== -->
<div class="main">
    <div class="topbar">
        <div class="left">
            <h2 id="pageTitle">
                <i class="fas fa-robot" style="color:#4dabf7;"></i> AI 助手
            </h2>
            <p id="pageDesc">自然语言驱动的经营操作</p>
        </div>
        <div class="right">
            <span class="btn" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> 刷新
            </span>
            <span class="btn" id="openNewBtn">
                <i class="fas fa-external-link-alt"></i> 新窗口打开
            </span>
            <span class="avatar">T</span>
        </div>
    </div>

    <!-- iframe 默认加载根目录的 ai_assistant.html -->
    <iframe id="contentFrame"
            class="content-frame"
            src="ai_assistant.html"
            name="contentFrame"></iframe>
</div>

<script>
    /* ============================================================
       main.html 主控脚本
       ============================================================ */
    var frame       = document.getElementById('contentFrame');
    var pageTitle   = document.getElementById('pageTitle');
    var pageDesc    = document.getElementById('pageDesc');
    var currentPage = 'ai_assistant.html';

    /* ===== 导航点击切换 ===== */
    document.querySelectorAll('.sidebar .item').forEach(function (item) {
        item.addEventListener('click', function () {
            document.querySelectorAll('.sidebar .item').forEach(function (i) {
                i.classList.remove('active');
            });
            this.classList.add('active');

            var page  = this.dataset.page;
            var title = this.dataset.title;
            var desc  = this.dataset.desc;

            currentPage = page;
            pageTitle.innerHTML = '<i class="fas fa-circle" style="color:#4dabf7;font-size:8px;"></i> ' + title;
            pageDesc.textContent = desc;

            // 切换 iframe
            frame.src = page;

            // 同步 URL hash
            location.hash = '#/' + page;
        });
    });

    /* ===== 刷新 ===== */
    document.getElementById('refreshBtn').addEventListener('click', function () {
        frame.src = frame.src;
    });

    /* ===== 新窗口打开 ===== */
    document.getElementById('openNewBtn').addEventListener('click', function () {
        window.open(currentPage, '_blank');
    });

    /* ===== 监听子页面 postMessage ===== */
    window.addEventListener('message', function (e) {
        var data = e.data || {};
        if (data.type === 'title') {
            pageTitle.innerHTML = '<i class="fas fa-circle" style="color:#4dabf7;font-size:8px;"></i> ' + data.value;
        }
        if (data.type === 'toast') {
            showToast(data.value);
        }
        if (data.type === 'navigate' && data.page) {
            document.querySelectorAll('.sidebar .item').forEach(function (i) {
                if (i.dataset.page === data.page) i.click();
            });
        }
    });

    /* ===== 全局 Toast ===== */
    function showToast(msg) {
        var toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.innerHTML = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(function () {
            toast.classList.remove('show');
        }, 2500);
    }

    /* ===== 根据 hash 恢复 ===== */
    window.addEventListener('DOMContentLoaded', function () {
        var hash = location.hash.replace('#/', '');
        if (hash) {
            document.querySelectorAll('.sidebar .item').forEach(function (i) {
                if (i.dataset.page === hash) i.click();
            });
        }
    });
</script>

<style>
    /* 补一个 toast 样式，不依赖 common.css */
    .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #0a1e2f;
        color: #fff;
        padding: 12px 28px;
        border-radius: 40px;
        font-size: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        display: none;
        z-index: 9999;
        white-space: nowrap;
    }
    .toast.show { display: block; animation: fadeUp 0.3s ease; }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateX(-50%) translateY(20px); }
        to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
</style>
</body>
</html>
