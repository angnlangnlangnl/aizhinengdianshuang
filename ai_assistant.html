<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智控电商 · AI 助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #eef2f8;
            color: #0a1a2b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-header {
            background: #0a1e2f;
            color: #e2e8f0;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            z-index: 10;
        }
        .app-header .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: white; }
        .app-header .logo i { color: #4dabf7; font-size: 28px; background: rgba(77,171,247,0.12); padding: 8px; border-radius: 12px; }
        .app-header .logo span { color: #4dabf7; }
        .app-header .status { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #9bb4cc; }
        .app-header .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #0d7c4f; display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .app-header .status .btn { padding: 6px 18px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: #b8cfe0; font-size: 13px; cursor: default; transition: 0.15s; display: flex; align-items: center; gap: 6px; }
        .app-header .status .btn:hover { background: rgba(255,255,255,0.08); }
        .app-header .status .btn i { color: #5a7f99; }
        .app-body { flex: 1; display: flex; overflow: hidden; }
        .sidebar-chat { width: 280px; background: white; border-right: 1px solid #e8edf4; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-chat .sidebar-header { padding: 16px 20px; border-bottom: 1px solid #e8edf4; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-chat .sidebar-header h3 { font-size: 14px; font-weight: 600; color: #0a1e2f; }
        .sidebar-chat .sidebar-header .new-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: #0a1e2f; color: white; cursor: pointer; font-size: 16px; transition: 0.15s; }
        .sidebar-chat .sidebar-header .new-btn:hover { background: #1a3a5a; }
        .sidebar-chat .chat-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
        .sidebar-chat .chat-list::-webkit-scrollbar { width: 4px; }
        .sidebar-chat .chat-list::-webkit-scrollbar-track { background: #f0f4f9; }
        .sidebar-chat .chat-list::-webkit-scrollbar-thumb { background: #dce5ef; border-radius: 10px; }
        .chat-history-item { padding: 12px 14px; border-radius: 10px; margin-bottom: 4px; cursor: pointer; transition: 0.15s; border: 1px solid transparent; }
        .chat-history-item:hover { background: #f5f8fc; border-color: #e8edf4; }
        .chat-history-item.active { background: #f0f7fe; border-color: rgba(77,171,247,0.2); }
        .chat-history-item .title { font-size: 14px; font-weight: 500; color: #0a1e2f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-history-item .meta { font-size: 12px; color: #94a3b8; margin-top: 2px; display: flex; justify-content: space-between; }
        .chat-history-item .meta .tag { font-size: 10px; padding: 1px 10px; border-radius: 30px; background: #f0f7fe; color: #2a7faa; }
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #f8fafc; min-width: 0; }
        .chat-main-header { padding: 16px 28px; background: white; border-bottom: 1px solid #e8edf4; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .chat-main-header .info h4 { font-size: 16px; font-weight: 600; color: #0a1e2f; }
        .chat-main-header .info p { font-size: 13px; color: #5f7d95; }
        .chat-main-header .actions { display: flex; gap: 8px; }
        .chat-main-header .actions .btn-sm { padding: 5px 14px; border-radius: 20px; border: 1px solid #dce5ef; background: white; font-size: 12px; color: #1e3a5f; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: 0.1s; }
        .chat-main-header .actions .btn-sm:hover { border-color: #4dabf7; color: #2a7faa; }
        .messages { flex: 1; overflow-y: auto; padding: 20px 28px 12px; display: flex; flex-direction: column; gap: 16px; }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: #dce5ef; border-radius: 10px; }
        .message { display: flex; gap: 12px; max-width: 85%; animation: msgIn 0.3s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; flex-shrink: 0; }
        .message .avatar.ai { background: linear-gradient(135deg, #4dabf7, #2a7faa); }
        .message .avatar.user { background: #b55a1a; }
        .message .bubble { padding: 12px 18px; border-radius: 16px; font-size: 14px; line-height: 1.7; word-break: break-word; box-shadow: 0 1px 4px rgba(0,0,0,0.02); }
        .message .bubble p { margin-bottom: 6px; }
        .message .bubble p:last-child { margin-bottom: 0; }
        .message.user .bubble { background: #0a1e2f; color: white; border-radius: 16px 4px 16px 16px; }
        .message.ai .bubble { background: white; color: #0a1e2f; border: 1px solid #e8edf4; border-radius: 4px 16px 16px 16px; }
        .message .bubble .time { font-size: 11px; color: #94a3b8; margin-top: 6px; display: block; }
        .message.user .bubble .time { color: rgba(255,255,255,0.4); }
        .bubble .action-card { background: #f8fafc; border-radius: 10px; padding: 12px 16px; margin: 8px 0 4px 0; border: 1px solid #e8edf4; }
        .bubble .action-card .title { font-weight: 600; color: #0a1e2f; font-size: 14px; }
        .bubble .action-card .desc { font-size: 13px; color: #5f7d95; margin-top: 2px; }
        .bubble .action-card .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .bubble .action-card .btn-group .btn-sm { padding: 4px 14px; border-radius: 20px; border: none; font-size: 12px; font-weight: 500; cursor: pointer; transition: 0.1s; }
        .bubble .action-card .btn-group .btn-sm.primary { background: #0a1e2f; color: white; }
        .bubble .action-card .btn-group .btn-sm.success { background: #0d7c4f; color: white; }
        .bubble .action-card .btn-group .btn-sm.outline { background: transparent; border: 1px solid #dce5ef; color: #1e3a5f; }
        .bubble .action-card .btn-group .btn-sm:hover { transform: scale(0.97); }
        .quick-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .quick-tags .tag { padding: 4px 14px; border-radius: 30px; border: 1px solid #dce5ef; font-size: 12px; color: #5f7d95; cursor: pointer; background: white; transition: 0.15s; }
        .quick-tags .tag:hover { border-color: #4dabf7; color: #2a7faa; background: #f5f9fe; }
        .typing-indicator { display: none; align-items: center; gap: 12px; padding: 8px 0; }
        .typing-indicator.show { display: flex; }
        .typing-indicator .dots span { display: inline-block; width: 8px; height: 8px; background: #94a3b8; border-radius: 50%; margin-right: 4px; animation: dotPulse 1.2s infinite; }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }
        .input-area { padding: 16px 28px 20px; background: white; border-top: 1px solid #e8edf4; display: flex; gap: 12px; align-items: flex-end; flex-shrink: 0; }
        .input-area .input-wrap { flex: 1; display: flex; align-items: flex-end; background: #f8fafc; border: 1px solid #e8edf4; border-radius: 12px; padding: 6px 16px; transition: 0.15s; }
        .input-area .input-wrap:focus-within { border-color: #4dabf7; box-shadow: 0 0 0 3px rgba(77,171,247,0.06); }
        .input-area .input-wrap textarea { flex: 1; border: none; background: transparent; padding: 8px 0; font-size: 14px; font-family: inherit; resize: none; outline: none; max-height: 120px; color: #0a1e2f; }
        .input-area .input-wrap textarea::placeholder { color: #94a3b8; }
        .input-area .input-wrap .char-count { font-size: 11px; color: #94a3b8; padding-left: 8px; flex-shrink: 0; }
        .input-area .send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #0a1e2f; color: white; font-size: 18px; cursor: pointer; transition: 0.15s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .input-area .send-btn:hover { background: #1a3a5a; transform: scale(1.02); }
        .input-area .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; padding: 40px; text-align: center; }
        .empty-state i { font-size: 56px; color: #dce5ef; margin-bottom: 16px; }
        .empty-state h3 { font-size: 20px; color: #0a1e2f; margin-bottom: 6px; }
        .empty-state p { font-size: 14px; max-width: 400px; }
        .empty-state .examples { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; justify-content: center; }
        .empty-state .examples .ex { padding: 8px 18px; border-radius: 30px; border: 1px solid #dce5ef; font-size: 13px; color: #5f7d95; cursor: pointer; background: white; transition: 0.15s; }
        .empty-state .examples .ex:hover { border-color: #4dabf7; color: #2a7faa; background: #f5f9fe; }
        @media (max-width: 768px) {
            .app-header { padding: 10px 16px; }
            .app-header .logo { font-size: 16px; }
            .app-header .logo i { font-size: 20px; padding: 6px; }
            .app-header .status .btn span { display: none; }
            .sidebar-chat { width: 200px; }
            .chat-main-header { padding: 12px 16px; flex-wrap: wrap; gap: 6px; }
            .messages { padding: 12px 16px; }
            .message { max-width: 92%; }
            .input-area { padding: 12px 16px 16px; flex-wrap: wrap; }
        }
        @media (max-width: 480px) {
            .sidebar-chat { display: none; }
            .message { max-width: 96%; }
        }
    </style>
</head>
<body>

<header class="app-header">
    <div class="logo">
        <i class="fas fa-bolt"></i>
        智控电商 · <span>AI 助手</span>
    </div>
    <div class="status">
        <span><span class="dot"></span> 在线 · 已接入 DeepSeek</span>
        <span class="btn"><i class="fas fa-sync-alt"></i> <span>同步数据</span></span>
        <span class="btn"><i class="fas fa-cog"></i> <span>设置</span></span>
    </div>
</header>

<div class="app-body">
    <aside class="sidebar-chat">
        <div class="sidebar-header">
            <h3><i class="fas fa-history" style="color:#4dabf7; margin-right:6px;"></i> 对话历史</h3>
            <button class="new-btn" onclick="newChat()" title="新建对话"><i class="fas fa-plus"></i></button>
        </div>
        <div class="chat-list" id="chatHistoryList"></div>
    </aside>

    <main class="chat-main">
        <div class="chat-main-header">
            <div class="info">
                <h4 id="chatTitle">AI 经营助手</h4>
                <p id="chatSubtitle">基于 DeepSeek · 自然语言驱动运营</p>
            </div>
            <div class="actions">
                <span class="btn-sm" onclick="clearMessages()"><i class="fas fa-eraser"></i> 清空</span>
                <span class="btn-sm" onclick="exportChat()"><i class="fas fa-file-export"></i> 导出</span>
            </div>
        </div>

        <div class="messages" id="messageContainer">
            <div class="empty-state" id="emptyState">
                <i class="fas fa-robot"></i>
                <h3>👋 你好，我是 AI 经营助手</h3>
                <p>我可以帮你完成商品上架、数据查询、营销活动等经营任务。<br>试试在下方输入你的需求，就像和同事聊天一样自然。</p>
                <div class="examples">
                    <span class="ex" onclick="sendExample('把云山茶叶礼盒的价格改成118元')">💰 改价格</span>
                    <span class="ex" onclick="sendExample('把手工竹编包的库存增加50件')">📦 改库存</span>
                    <span class="ex" onclick="sendExample('查一下库存低于50件的商品')">📋 查库存</span>
                    <span class="ex" onclick="sendExample('把云山茶叶礼盒上架到抖音和淘宝')">🚀 多平台上架</span>
                </div>
            </div>
            <div id="messagesList"></div>
            <div class="typing-indicator" id="typingIndicator">
                <div class="avatar ai" style="width:28px;height:28px;font-size:12px;"><i class="fas fa-robot"></i></div>
                <div class="dots"><span></span><span></span><span></span></div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrap">
                <textarea id="chatInput" rows="1" placeholder="输入你的经营需求，例如：把云山茶叶礼盒的价格改成118元" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                <span class="char-count" id="charCount">0/500</span>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </main>
</div>

<script>
    const state = {
        currentChatId: null,
        isProcessing: false,
        pendingAction: null,
    };

    let historyData = [];

    function renderHistory() {
        const container = document.getElementById('chatHistoryList');
        if (historyData.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px;">暂无对话记录</div>';
            return;
        }
        container.innerHTML = historyData.map(item => `
            <div class="chat-history-item ${item.id === state.currentChatId ? 'active' : ''}" onclick="loadHistory('${item.id}')">
                <div class="title">${item.title}</div>
                <div class="meta">
                    <span>${item.preview}</span>
                    <span class="tag">${item.tag}</span>
                </div>
                <div class="meta" style="margin-top:2px;"><span>${item.time}</span></div>
            </div>
        `).join('');
    }

    function loadHistory(id) {
        const item = historyData.find(h => h.id === id);
        if (!item) return;
        state.currentChatId = id;
        renderHistory();
        document.getElementById('chatTitle').textContent = item.title;
        document.getElementById('chatSubtitle').textContent = '加载历史对话 · ' + item.time;
        const list = document.getElementById('messagesList');
        list.innerHTML = '';
        document.getElementById('emptyState').style.display = 'none';
        appendMessage({ role: 'user', text: item.title, time: item.time });
        appendMessage({ role: 'ai', text: item.preview, time: item.time });
    }

    function newChat() {
        state.currentChatId = null;
        renderHistory();
        document.getElementById('chatTitle').textContent = 'AI 经营助手';
        document.getElementById('chatSubtitle').textContent = '基于 DeepSeek · 自然语言驱动运营';
        document.getElementById('messagesList').innerHTML = '';
        document.getElementById('emptyState').style.display = 'flex';
        document.getElementById('chatInput').value = '';
        updateCharCount();
        document.getElementById('chatInput').focus();
    }

    function appendMessage(msg) {
        const list = document.getElementById('messagesList');
        const empty = document.getElementById('emptyState');
        if (empty) empty.style.display = 'none';

        const div = document.createElement('div');
        div.className = `message ${msg.role}`;
        const avatarIcon = msg.role === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
        const avatarClass = msg.role === 'user' ? 'user' : 'ai';

        let bubbleContent = `<div class="bubble">`;
        if (msg.text) bubbleContent += `<p>${msg.text.replace(/\n/g, '<br>')}</p>`;
        if (msg.card) {
            bubbleContent += `
                <div class="action-card">
                    <div class="title">${msg.card.title}</div>
                    <div class="desc">${msg.card.desc.replace(/\n/g, '<br>')}</div>
                    <div class="btn-group">
                        ${msg.card.actions.map(a => {
                            const cls = a.type === 'confirm' ? 'success' : a.type === 'cancel' ? 'outline' : 'primary';
                            return `<span class="btn-sm ${cls}" onclick="${a.onclick}">${a.label}</span>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        bubbleContent += `<span class="time">${msg.time || new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}</span>`;
        bubbleContent += `</div>`;

        div.innerHTML = `<div class="avatar ${avatarClass}">${avatarIcon}</div>${bubbleContent}`;
        list.appendChild(div);
        const container = document.getElementById('messageContainer');
        setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
    }

    // ================================================================
    // 核心：调用后端 DeepSeek 服务
    // ================================================================
    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || state.isProcessing) return;
        if (text.length > 500) { showToast('⚠️ 输入内容不能超过500字'); return; }

        appendMessage({ role: 'user', text: text, time: nowTime() });
        input.value = '';
        updateCharCount();
        state.isProcessing = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('typingIndicator').classList.add('show');
        document.getElementById('messageContainer').scrollTop = document.getElementById('messageContainer').scrollHeight;

        try {
            const res = await fetch('https://ai-ecommerce-backend-production-0776.up.railway.app/api/ai/parse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            const data = await res.json();

            document.getElementById('typingIndicator').classList.remove('show');

            if (data.type === 'chat' || data.type === 'error') {
                appendMessage({
                    role: 'ai',
                    text: data.text || '抱歉，AI 服务暂时不可用。',
                    time: nowTime()
                });
            } else if (data.type === 'update_price') {
                state.pendingAction = data;
                appendMessage({
                    role: 'ai',
                    text: '我理解你要修改价格，请确认以下信息：',
                    time: nowTime(),
                    card: {
                        title: '💰 价格修改预览',
                        desc: `商品：${data.args.product_name}\n新价格：¥${data.args.new_price}\n生效范围：全平台（淘宝/抖音/拼多多/京东）`,
                        actions: [
                            { label: '✅ 确认执行', type: 'confirm', onclick: 'confirmAction()' },
                            { label: '✖ 取消', type: 'cancel', onclick: 'cancelAction()' }
                        ]
                    }
                });
            } else if (data.type === 'update_stock') {
                state.pendingAction = data;
                const actionText = data.args.action === 'increase' ? '增加' :
                                   data.args.action === 'decrease' ? '减少' : '设置为';
                appendMessage({
                    role: 'ai',
                    text: '我理解你要调整库存，请确认以下信息：',
                    time: nowTime(),
                    card: {
                        title: '📦 库存修改预览',
                        desc: `商品：${data.args.product_name}\n操作：${actionText} ${data.args.amount} 件\n生效范围：全平台库存同步`,
                        actions: [
                            { label: '✅ 确认执行', type: 'confirm', onclick: 'confirmAction()' },
                            { label: '✖ 取消', type: 'cancel', onclick: 'cancelAction()' }
                        ]
                    }
                });
            } else if (data.type === 'query_low_stock') {
                // 模拟低库存商品列表（真实项目应该调后端 API）
                const allProducts = [
                    { name: '云山茶叶礼盒', stock: 234 },
                    { name: '手工竹编包', stock: 187 },
                    { name: '山核桃仁 250g', stock: 156 },
                    { name: '云山手工皂套装', stock: 89 },
                    { name: '云山陶瓷杯', stock: 143 },
                    { name: '手写书法折扇', stock: 0 },
                    { name: '手工红糖姜茶', stock: 210 },
                    { name: '云山国风丝巾', stock: 76 }
                ];
                const lowStock = allProducts.filter(p => p.stock < data.args.threshold);

                if (lowStock.length === 0) {
                    appendMessage({
                        role: 'ai',
                        text: `✅ 库存低于 ${data.args.threshold} 件的商品：没有`,
                        time: nowTime()
                    });
                } else {
                    const list = lowStock.map(p => `· ${p.name}：库存 ${p.stock} 件`).join('\n');
                    appendMessage({
                        role: 'ai',
                        text: `📋 库存低于 ${data.args.threshold} 件的商品共 ${lowStock.length} 个：\n${list}`,
                        time: nowTime()
                    });
                }
            } else if (data.type === 'publish_to_platforms') {
                state.pendingAction = data;
                appendMessage({
                    role: 'ai',
                    text: '我理解你要上架商品到多个平台，请确认：',
                    time: nowTime(),
                    card: {
                        title: '🚀 多平台上架预览',
                        desc: `商品：${data.args.product_name}\n目标平台：${data.args.platforms.join('、')}`,
                        actions: [
                            { label: '✅ 确认上架', type: 'confirm', onclick: 'confirmAction()' },
                            { label: '✖ 取消', type: 'cancel', onclick: 'cancelAction()' }
                        ]
                    }
                });
            } else {
                appendMessage({
                    role: 'ai',
                    text: '收到你的需求，但暂时无法处理。',
                    time: nowTime()
                });
            }

            // 写入历史
            historyData.unshift({
                id: 'h' + Date.now(),
                title: text.length > 20 ? text.slice(0, 20) + '...' : text,
                preview: (data.text || '操作预览').slice(0, 30) + '...',
                time: nowTime(),
                tag: data.type.includes('price') ? '商品' : data.type.includes('stock') ? '库存' : '运营'
            });
            if (historyData.length > 20) historyData.pop();
            renderHistory();

        } catch (err) {
            document.getElementById('typingIndicator').classList.remove('show');
            appendMessage({
                role: 'ai',
                text: '⚠️ 无法连接后端服务。\n\n请确认：\n1. uvicorn 正在运行（localhost:8000）\n2. 后端窗口没有被关闭\n\n错误信息：' + err.message,
                time: nowTime()
            });
        }

        state.isProcessing = false;
        document.getElementById('sendBtn').disabled = false;
    }

    // ================================================================
    // 确认执行 / 取消
    // ================================================================
    function confirmAction() {
        if (!state.pendingAction) {
            showToast('⚠️ 没有待执行的操作');
            return;
        }
        const action = state.pendingAction;
        state.pendingAction = null;

        let msg = '';
        if (action.type === 'update_price') {
            msg = `✅ 已执行：将「${action.args.product_name}」的价格改为 ¥${action.args.new_price}`;
        } else if (action.type === 'update_stock') {
            const actionText = action.args.action === 'increase' ? '增加' :
                               action.args.action === 'decrease' ? '减少' : '设置为';
            msg = `✅ 已执行：将「${action.args.product_name}」的库存${actionText} ${action.args.amount} 件`;
        } else if (action.type === 'publish_to_platforms') {
            msg = `✅ 已执行：将「${action.args.product_name}」上架到 ${action.args.platforms.join('、')}`;
        } else {
            msg = '✅ 操作已完成';
        }

        appendMessage({
            role: 'ai',
            text: msg,
            time: nowTime()
        });
    }

    function cancelAction() {
        state.pendingAction = null;
        appendMessage({
            role: 'ai',
            text: '好的，已取消该操作。有其他需要随时告诉我。',
            time: nowTime()
        });
    }

    // ================================================================
    // 辅助函数
    // ================================================================
    function nowTime() {
        const d = new Date();
        return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }

    function sendExample(text) {
        document.getElementById('chatInput').value = text;
        updateCharCount();
        sendMessage();
    }

    function clearMessages() {
        if (document.getElementById('messagesList').children.length === 0) return;
        if (!confirm('确定要清空当前对话吗？')) return;
        document.getElementById('messagesList').innerHTML = '';
        document.getElementById('emptyState').style.display = 'flex';
        document.getElementById('chatTitle').textContent = 'AI 经营助手';
        document.getElementById('chatSubtitle').textContent = '基于 DeepSeek · 自然语言驱动运营';
        state.currentChatId = null;
        renderHistory();
        showToast('🗑️ 已清空对话');
    }

    function exportChat() {
        const msgs = document.querySelectorAll('#messagesList .message');
        if (msgs.length === 0) { showToast('⚠️ 暂无对话可导出'); return; }
        let text = '智控电商 · AI助手对话记录\n' + '='.repeat(50) + '\n';
        msgs.forEach(m => {
            const role = m.classList.contains('user') ? '用户' : 'AI助手';
            const bubble = m.querySelector('.bubble');
            const content = bubble ? bubble.textContent.replace(/\d{2}:\d{2}/, '').trim() : '';
            text += `[${role}] ${content}\n`;
        });
        text += '='.repeat(50) + '\n导出时间: ' + new Date().toLocaleString();
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'AI助手对话记录_' + new Date().toISOString().slice(0,10) + '.txt';
        a.click();
        URL.revokeObjectURL(a.href);
        showToast('📥 对话已导出');
    }

    function showToast(msg) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#0a1e2f;color:white;padding:12px 28px;border-radius:40px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,0.15);z-index:999;white-space:nowrap;display:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;`;
            document.body.appendChild(toast);
        }
        toast.innerHTML = msg;
        toast.style.display = 'block';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        updateCharCount();
    }

    function updateCharCount() {
        const input = document.getElementById('chatInput');
        const count = document.getElementById('charCount');
        const len = input.value.length;
        count.textContent = len + '/500';
        count.style.color = len > 450 ? '#b51a3f' : '#94a3b8';
    }

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        renderHistory();
        document.getElementById('chatInput').focus();
        document.getElementById('messageContainer').addEventListener('click', () => {
            document.getElementById('chatInput').focus();
        });
    });

    console.log('🤖 智控电商 · AI助手已加载（真实后端模式）');
    console.log('💡 后端地址: https://ai-ecommerce-backend-production-0776.up.railway.app/api/ai/parse');
</script>
</body>
</html>
