<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智控电商 · AI 助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #eef2f8;
            color: #0a1a2b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-header {
            background: #0a1e2f;
            color: #e2e8f0;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            z-index: 10;
        }
        .app-header .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: white; }
        .app-header .logo i { color: #4dabf7; font-size: 28px; background: rgba(77,171,247,0.12); padding: 8px; border-radius: 12px; }
        .app-header .logo span { color: #4dabf7; }
        .app-header .status { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #9bb4cc; }
        .app-header .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #0d7c4f; display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .app-header .status .btn { padding: 6px 18px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: #b8cfe0; font-size: 13px; cursor: pointer; transition: 0.15s; display: flex; align-items: center; gap: 6px; text-decoration: none; }
        .app-header .status .btn:hover { background: rgba(255,255,255,0.08); }
        .app-header .status .btn i { color: #5a7f99; }
        .app-body { flex: 1; display: flex; overflow: hidden; }
        .sidebar-chat { width: 280px; background: white; border-right: 1px solid #e8edf4; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-chat .sidebar-header { padding: 16px 20px; border-bottom: 1px solid #e8edf4; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-chat .sidebar-header h3 { font-size: 14px; font-weight: 600; color: #0a1e2f; }
        .sidebar-chat .sidebar-header .new-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: #0a1e2f; color: white; cursor: pointer; font-size: 16px; transition: 0.15s; }
        .sidebar-chat .sidebar-header .new-btn:hover { background: #1a3a5a; }
        .sidebar-chat .chat-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
        .sidebar-chat .chat-list::-webkit-scrollbar { width: 4px; }
        .sidebar-chat .chat-list::-webkit-scrollbar-track { background: #f0f4f9; }
        .sidebar-chat .chat-list::-webkit-scrollbar-thumb { background: #dce5ef; border-radius: 10px; }
        .chat-history-item { padding: 12px 14px; border-radius: 10px; margin-bottom: 4px; cursor: pointer; transition: 0.15s; border: 1px solid transparent; }
        .chat-history-item:hover { background: #f5f8fc; border-color: #e8edf4; }
        .chat-history-item.active { background: #f0f7fe; border-color: rgba(77,171,247,0.2); }
        .chat-history-item .title { font-size: 14px; font-weight: 500; color: #0a1e2f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-history-item .meta { font-size: 12px; color: #94a3b8; margin-top: 2px; display: flex; justify-content: space-between; }
        .chat-history-item .meta .tag { font-size: 10px; padding: 1px 10px; border-radius: 30px; background: #f0f7fe; color: #2a7faa; }
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #f8fafc; min-width: 0; }
        .chat-main-header { padding: 16px 28px; background: white; border-bottom: 1px solid #e8edf4; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .chat-main-header .info h4 { font-size: 16px; font-weight: 600; color: #0a1e2f; }
        .chat-main-header .info p { font-size: 13px; color: #5f7d95; }
        .chat-main-header .actions { display: flex; gap: 8px; }
        .chat-main-header .actions .btn-sm { padding: 5px 14px; border-radius: 20px; border: 1px solid #dce5ef; background: white; font-size: 12px; color: #1e3a5f; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: 0.1s; }
        .chat-main-header .actions .btn-sm:hover { border-color: #4dabf7; color: #2a7faa; }
        .messages { flex: 1; overflow-y: auto; padding: 20px 28px 12px; display: flex; flex-direction: column; gap: 16px; }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: #dce5ef; border-radius: 10px; }
        .message { display: flex; gap: 12px; max-width: 85%; animation: msgIn 0.3s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; flex-shrink: 0; }
        .message .avatar.ai { background: linear-gradient(135deg, #4dabf7, #2a7faa); }
        .message .avatar.user { background: #b55a1a; }
        .message .bubble { padding: 12px 18px; border-radius: 16px; font-size: 14px; line-height: 1.7; word-break: break-word; box-shadow: 0 1px 4px rgba(0,0,0,0.02); }
        .message .bubble p { margin-bottom: 6px; }
        .message .bubble p:last-child { margin-bottom: 0; }
        .message.user .bubble { background: #0a1e2f; color: white; border-radius: 16px 4px 16px 16px; }
        .message.ai .bubble { background: white; color: #0a1e2f; border: 1px solid #e8edf4; border-radius: 4px 16px 16px 16px; }
        .message .bubble .time { font-size: 11px; color: #94a3b8; margin-top: 6px; display: block; }
        .message.user .bubble .time { color: rgba(255,255,255,0.4); }
        .bubble .action-card { background: #f8fafc; border-radius: 10px; padding: 12px 16px; margin: 8px 0 4px 0; border: 1px solid #e8edf4; }
        .bubble .action-card .title { font-weight: 600; color: #0a1e2f; font-size: 14px; }
        .bubble .action-card .desc { font-size: 13px; color: #5f7d95; margin-top: 2px; }
        .bubble .action-card .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .bubble .action-card .btn-group .btn-sm { padding: 4px 14px; border-radius: 20px; border: none; font-size: 12px; font-weight: 500; cursor: pointer; transition: 0.1s; }
        .bubble .action-card .btn-group .btn-sm.primary { background: #0a1e2f; color: white; }
        .bubble .action-card .btn-group .btn-sm.success { background: #0d7c4f; color: white; }
        .bubble .action-card .btn-group .btn-sm.danger { background: #b51a3f; color: white; }
        .bubble .action-card .btn-group .btn-sm.outline { background: transparent; border: 1px solid #dce5ef; color: #1e3a5f; }
        .bubble .action-card .btn-group .btn-sm:hover { transform: scale(0.97); }
        .typing-indicator { display: none; align-items: center; gap: 12px; padding: 8px 0; }
        .typing-indicator.show { display: flex; }
        .typing-indicator .dots span { display: inline-block; width: 8px; height: 8px; background: #94a3b8; border-radius: 50%; margin-right: 4px; animation: dotPulse 1.2s infinite; }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }
        .input-area { padding: 16px 28px 20px; background: white; border-top: 1px solid #e8edf4; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
        .input-area .voice-btn {
            width: 44px; height: 44px; border-radius: 12px; border: 1px solid #dce5ef;
            background: #f8fafc; color: #5f7d95; font-size: 16px; cursor: pointer;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            transition: 0.2s; user-select: none;
        }
        .input-area .voice-btn:hover { border-color: #4dabf7; color: #4dabf7; }
        .input-area .voice-btn.active {
            background: #1a3a2a; border-color: #0d7c4f; color: #4ade80;
            box-shadow: 0 0 0 3px rgba(13,124,79,0.15);
        }
        .input-area .input-wrap { flex: 1; display: flex; align-items: flex-end; background: #f8fafc; border: 1px solid #e8edf4; border-radius: 12px; padding: 6px 16px; transition: 0.2s; position: relative; }
        .input-area .input-wrap:focus-within { border-color: #4dabf7; box-shadow: 0 0 0 3px rgba(77,171,247,0.06); }
        .input-area .input-wrap.recording { background: #e6f7ec; border-color: #0d7c4f; box-shadow: 0 0 0 3px rgba(13,124,79,0.12); }
        .input-area .input-wrap.cancel-mode { background: #fde8ed; border-color: #b51a3f; box-shadow: 0 0 0 3px rgba(181,26,63,0.12); }
        .input-area .input-wrap textarea { flex: 1; border: none; background: transparent; padding: 8px 0; font-size: 14px; font-family: inherit; resize: none; outline: none; max-height: 120px; color: #0a1e2f; }
        .input-area .input-wrap textarea::placeholder { color: #94a3b8; }
        .input-area .input-wrap textarea:read-only { cursor: pointer; }
        .input-area .input-wrap .char-count { font-size: 11px; color: #94a3b8; padding-left: 8px; flex-shrink: 0; }
        .input-area .input-wrap .char-count.recording { color: #0d7c4f; font-weight: 600; }
        .input-area .input-wrap .char-count.cancel-mode { color: #b51a3f; font-weight: 600; }
        .input-area .send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #0a1e2f; color: white; font-size: 18px; cursor: pointer; transition: 0.15s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .input-area .send-btn:hover { background: #1a3a5a; transform: scale(1.02); }
        .input-area .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; padding: 40px; text-align: center; }
        .empty-state i { font-size: 56px; color: #dce5ef; margin-bottom: 16px; }
        .empty-state h3 { font-size: 20px; color: #0a1e2f; margin-bottom: 6px; }
        .empty-state p { font-size: 14px; max-width: 500px; }
        .empty-state .examples { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; justify-content: center; max-width: 700px; }
        .empty-state .examples .ex { padding: 8px 18px; border-radius: 30px; border: 1px solid #dce5ef; font-size: 13px; color: #5f7d95; cursor: pointer; background: white; transition: 0.15s; }
        .empty-state .examples .ex:hover { border-color: #4dabf7; color: #2a7faa; background: #f5f9fe; }
        .empty-state .examples .ex.danger:hover { border-color: #b51a3f; color: #b51a3f; background: #fde8ed; }
        /* 语音提示条 */
        .voice-tip {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: #0d7c4f;
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            z-index: 9998;
            box-shadow: 0 10px 30px rgba(13,124,79,0.4);
            transition: 0.2s ease;
            align-items: center;
            gap: 8px;
        }
        .voice-tip.show { display: flex; transform: translateX(-50%) translateY(0); }
        .voice-tip.cancel { background: #b51a3f; box-shadow: 0 10px 30px rgba(181,26,63,0.4); }
        .voice-tip i { font-size: 14px; }
        .voice-tip .wave { display: flex; gap: 2px; align-items: center; height: 16px; }
        .voice-tip .wave span { display: block; width: 2px; height: 100%; background: white; border-radius: 2px; animation: voiceWave 0.8s ease-in-out infinite alternate; }
        .voice-tip .wave span:nth-child(1) { animation-delay: 0s; height: 40%; }
        .voice-tip .wave span:nth-child(2) { animation-delay: 0.15s; height: 70%; }
        .voice-tip .wave span:nth-child(3) { animation-delay: 0.3s; height: 100%; }
        .voice-tip .wave span:nth-child(4) { animation-delay: 0.45s; height: 70%; }
        .voice-tip .wave span:nth-child(5) { animation-delay: 0.6s; height: 40%; }
        @keyframes voiceWave { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1); } }
        @media (max-width: 768px) {
            .app-header { padding: 10px 16px; }
            .app-header .logo { font-size: 16px; }
            .app-header .logo i { font-size: 20px; padding: 6px; }
            .app-header .status .btn span { display: none; }
            .sidebar-chat { width: 200px; }
            .chat-main-header { padding: 12px 16px; flex-wrap: wrap; gap: 6px; }
            .messages { padding: 12px 16px; }
            .message { max-width: 92%; }
            .input-area { padding: 12px 16px 16px; }
        }
        @media (max-width: 480px) {
            .sidebar-chat { display: none; }
            .message { max-width: 96%; }
            .input-area { padding: 10px 12px 12px; }
            .input-area .voice-btn, .input-area .send-btn { width: 40px; height: 40px; font-size: 15px; }
        }
    </style>
</head>
<body>

<header class="app-header">
    <div class="logo">
        <i class="fas fa-bolt"></i>
        智控电商 · <span>AI 助手</span>
    </div>
    <div class="status">
        <span><span class="dot"></span> 在线 · 已接入 DeepSeek</span>
        <a class="btn" href="products.html" target="_blank"><i class="fas fa-eye"></i> <span>查看商品</span></a>
        <a class="btn" href="images.html" target="_blank"><i class="fas fa-images"></i> <span>图片管理</span></a>
        <a class="btn" href="logs.html" target="_blank"><i class="fas fa-history"></i> <span>操作日志</span></a>
    </div>
</header>

<div class="app-body">
    <aside class="sidebar-chat">
        <div class="sidebar-header">
            <h3><i class="fas fa-history" style="color:#4dabf7; margin-right:6px;"></i> 对话历史</h3>
            <button class="new-btn" onclick="newChat()" title="新建对话"><i class="fas fa-plus"></i></button>
        </div>
        <div class="chat-list" id="chatHistoryList"></div>
    </aside>

    <main class="chat-main">
        <div class="chat-main-header">
            <div class="info">
                <h4 id="chatTitle">AI 经营助手</h4>
                <p id="chatSubtitle">基于 DeepSeek · 33 种指令可用</p>
            </div>
            <div class="actions">
                <span class="btn-sm" onclick="clearMessages()"><i class="fas fa-eraser"></i> 清空</span>
                <span class="btn-sm" onclick="exportChat()"><i class="fas fa-file-export"></i> 导出</span>
            </div>
        </div>

        <div class="messages" id="messageContainer">
            <div class="empty-state" id="emptyState">
                <i class="fas fa-robot"></i>
                <h3>👋 你好，我是 AI 经营助手</h3>
                <p>支持 33 种操作。点 🎤 可切换语音模式，长按输入框说话，松手发送。</p>
                <div class="examples">
                    <span class="ex" onclick="sendExample('把云山茶叶礼盒的价格改成118元')">💰 改价格</span>
                    <span class="ex" onclick="sendExample('新增一个商品叫云山红茶，价格88元')">➕ 新增商品</span>
                    <span class="ex" onclick="sendExample('查一下需要补货的商品')">⚠️ 库存预警</span>
                    <span class="ex" onclick="sendExample('查看云山茶叶礼盒的图片')">🖼️ 查看图片</span>
                    <span class="ex" onclick="sendExample('删除云山茶叶礼盒的主图')">🗑️ 删除主图</span>
                    <span class="ex" onclick="sendExample('清空云山茶叶礼盒的所有副图')">🧹 清空副图</span>
                    <span class="ex" onclick="sendExample('导出所有商品数据到CSV')">📤 导出CSV</span>
                    <span class="ex danger" onclick="sendExample('删除所有文创类商品')">🗑️ 批量删除（高危）</span>
                </div>
            </div>
            <div id="messagesList"></div>
            <div class="typing-indicator" id="typingIndicator">
                <div class="avatar ai" style="width:28px;height:28px;font-size:12px;"><i class="fas fa-robot"></i></div>
                <div class="dots"><span></span><span></span><span></span></div>
            </div>
        </div>

        <div class="input-area">
            <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceMode()" title="语音输入">
                <i class="fas fa-microphone"></i>
            </button>
            <div class="input-wrap" id="inputWrap">
                <textarea id="chatInput" rows="1" placeholder="输入你的经营需求，例如：查一下需要补货的商品" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                <span class="char-count" id="charCount">0/500</span>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </main>
</div>

<!-- 语音提示条 -->
<div class="voice-tip" id="voiceTip">
    <span class="wave"><span></span><span></span><span></span><span></span><span></span></span>
    <span id="voiceTipText">请说话...</span>
</div>

<script>
    const BACKEND_URL = 'https://ai-ecommerce-backend-production-0776.up.railway.app';

    const state = {
        currentChatId: null,
        isProcessing: false,
        pendingAction: null,
    };

    let historyData = [];

    // ================================================================
    // 语音模式状态
    // ================================================================
    let recognition = null;
    let isVoiceMode = false;       // 是否处于语音模式
    let isListening = false;       // 是否正在识别
    let isRecording = false;       // 是否处于"按住录音"状态
    let isCancelMode = false;      // 是否上滑取消
    let pressStartTime = 0;        // 按下时刻
    let longPressTimer = null;     // 长按计时器
    let pointerStartY = 0;         // 起始 Y 坐标
    let voiceTranscript = '';      // 当前识别的文本

    const LONG_PRESS_MS = 300;     // 长按 300ms 开始录音
    const CANCEL_DISTANCE = 60;    // 上滑 60px 取消

    // ================================================================
    // 初始化语音识别
    // ================================================================
    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return false;
        if (recognition) {
            try { recognition.abort(); } catch (e) {}
            recognition = null;
        }
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        recognition.continuous = true;      // 持续识别
        recognition.interimResults = true;  // 显示临时结果
        recognition.maxAlternatives = 1;
        return true;
    }

    // ================================================================
    // 切换语音模式
    // ================================================================
    function toggleVoiceMode() {
        const voiceBtn = document.getElementById('voiceBtn');
        const input = document.getElementById('chatInput');
        const inputWrap = document.getElementById('inputWrap');

        if (!isVoiceMode) {
            if (!initSpeechRecognition()) {
                showToast('⚠️ 当前浏览器不支持语音，请使用 Chrome 或 Edge');
                return;
            }
            isVoiceMode = true;
            voiceBtn.classList.add('active');
            voiceBtn.innerHTML = '<i class="fas fa-keyboard"></i>';
            input.placeholder = '按住说话，或点击输入框开始识别';
            input.readOnly = true;
            inputWrap.style.cursor = 'pointer';
            showToast('🎤 语音模式已开启，长按输入框说话');
        } else {
            isVoiceMode = false;
            voiceBtn.classList.remove('active');
            voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            input.placeholder = '输入你的经营需求，例如：查一下需要补货的商品';
            input.readOnly = false;
            inputWrap.style.cursor = '';
            input.value = '';
            updateCharCount();
            stopVoice();
            showToast('⌨️ 已切换回键盘模式');
        }
    }

    // ================================================================
    // 停止语音
    // ================================================================
    function stopVoice() {
        if (recognition) {
            try { recognition.abort(); } catch (e) {}
        }
        isListening = false;
        isRecording = false;
        isCancelMode = false;
        clearTimeout(longPressTimer);
        longPressTimer = null;
        const inputWrap = document.getElementById('inputWrap');
        const charCount = document.getElementById('charCount');
        inputWrap.classList.remove('recording', 'cancel-mode');
        charCount.classList.remove('recording', 'cancel-mode');
        hideVoiceTip();
    }

    // ================================================================
    // 开始识别（按住录音触发）
    // ================================================================
    function startVoiceRecognition(isHoldMode) {
        if (isListening) return;
        if (!recognition) {
            if (!initSpeechRecognition()) return;
        }

        voiceTranscript = '';
        const input = document.getElementById('chatInput');
        const inputWrap = document.getElementById('inputWrap');
        const charCount = document.getElementById('charCount');

        if (isHoldMode) {
            isRecording = true;
            inputWrap.classList.add('recording');
            charCount.classList.add('recording');
            input.value = '';
            input.placeholder = '松开手指发送...';
            showVoiceTip('请说话...', false);
        } else {
            input.placeholder = '聆听中...';
            showVoiceTip('请说话...', false);
        }

        recognition.onresult = function(event) {
            let interimText = '';
            let finalText = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalText += transcript;
                } else {
                    interimText += transcript;
                }
            }
            voiceTranscript = finalText || interimText;
            if (voiceTranscript.trim()) {
                input.value = voiceTranscript;
                updateCharCount();
            }
        };

        recognition.onerror = function(event) {
            console.warn('语音识别错误:', event.error);
            if (event.error === 'aborted') return;
            let msg = '语音识别失败';
            if (event.error === 'not-allowed') msg = '请授权麦克风权限';
            else if (event.error === 'no-speech') msg = '未检测到语音';
            else if (event.error === 'audio-capture') msg = '无法访问麦克风';
            else if (event.error === 'network') msg = '网络异常';
            showToast('⚠️ ' + msg);
            stopVoice();
            const input = document.getElementById('chatInput');
            input.value = '';
            input.placeholder = isVoiceMode ? '按住说话，或点击输入框开始识别' : '输入你的经营需求...';
            updateCharCount();
        };

        recognition.onend = function() {
            isListening = false;
            // 如果仍在录音中（用户还没松手），尝试重启
            if (isRecording && !isCancelMode) {
                try {
                    recognition.start();
                    isListening = true;
                } catch (e) {}
            }
        };

        try {
            recognition.start();
            isListening = true;
        } catch (e) {
            console.warn('启动识别失败:', e);
            showToast('⚠️ 启动语音识别失败');
            stopVoice();
        }
    }

    // ================================================================
    // 结束识别并发送
    // ================================================================
    function finishVoiceRecognition() {
        const input = document.getElementById('chatInput');
        const inputWrap = document.getElementById('inputWrap');
        const charCount = document.getElementById('charCount');

        // 停止识别
        if (recognition) {
            try { recognition.stop(); } catch (e) {}
        }

        // 先保存文本
        const text = (input.value || voiceTranscript || '').trim();

        // 清理状态
        isRecording = false;
        isCancelMode = false;
        inputWrap.classList.remove('recording', 'cancel-mode');
        charCount.classList.remove('recording', 'cancel-mode');
        hideVoiceTip();

        if (isCancelMode || !text) {
            // 取消 或 空结果
            input.value = '';
            input.placeholder = '按住说话，或点击输入框开始识别';
            updateCharCount();
            if (!text && !isCancelMode) {
                showToast('⚠️ 未识别到语音，请重试');
            }
            return;
        }

        // 发送给 AI
        input.value = '';
        input.placeholder = '按住说话，或点击输入框开始识别';
        updateCharCount();

        // 显示用户消息 + 触发 AI 处理
        sendMessageFromVoice(text);
    }

    // ================================================================
    // 语音发送消息（复用 sendMessage 逻辑，但保留语音模式状态）
    // ================================================================
    async function sendMessageFromVoice(text) {
        if (!text || state.isProcessing) return;

        appendMessage({ role: 'user', text: text, time: nowTime() });
        state.isProcessing = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('typingIndicator').classList.add('show');
        document.getElementById('messageContainer').scrollTop = document.getElementById('messageContainer').scrollHeight;

        try {
            const res = await fetch(BACKEND_URL + '/api/ai/parse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            const data = await res.json();

            document.getElementById('typingIndicator').classList.remove('show');

            if (data.type === 'chat' || data.type === 'error') {
                appendMessage({ role: 'ai', text: data.text || '抱歉，AI 服务暂时不可用。', time: nowTime() });
            } else {
                state.pendingAction = data;
                const card = buildCard(data);
                const confirmLabel = card.isDanger ? '🗑️ 确认删除' : '✅ 确认执行';
                const confirmType = card.isDanger ? 'danger' : 'confirm';
                appendMessage({
                    role: 'ai',
                    text: card.isDanger ? '⚠️ 这是高危操作，请仔细确认：' : '我理解你的指令，请确认：',
                    time: nowTime(),
                    card: {
                        title: card.title,
                        desc: card.desc,
                        actions: [
                            { label: confirmLabel, type: confirmType, onclick: 'confirmAction()' },
                            { label: '✖ 取消', type: 'cancel', onclick: 'cancelAction()' }
                        ]
                    }
                });
            }

            historyData.unshift({
                id: 'h' + Date.now(),
                title: text.length > 20 ? text.slice(0, 20) + '...' : text,
                preview: (data.text || '操作预览').slice(0, 30) + '...',
                time: nowTime(),
                tag: '语音'
            });
            if (historyData.length > 20) historyData.pop();
            renderHistory();

        } catch (err) {
            document.getElementById('typingIndicator').classList.remove('show');
            appendMessage({ role: 'ai', text: '⚠️ 无法连接后端服务。\n错误：' + err.message, time: nowTime() });
        }

        state.isProcessing = false;
        document.getElementById('sendBtn').disabled = false;
    }

    // ================================================================
    // 指针事件（长按录音 + 上滑取消）
    // ================================================================
    function onPointerDown(e) {
        if (!isVoiceMode || isRecording) return;
        e.preventDefault();
        pointerStartY = e.clientY;
        pressStartTime = Date.now();
        isCancelMode = false;

        longPressTimer = setTimeout(function() {
            // 300ms 后触发录音
            startVoiceRecognition(true);
        }, LONG_PRESS_MS);
    }

    function onPointerMove(e) {
        if (!isRecording) return;
        const diff = pointerStartY - e.clientY;
        if (diff > CANCEL_DISTANCE) {
            if (!isCancelMode) {
                isCancelMode = true;
                const inputWrap = document.getElementById('inputWrap');
                const charCount = document.getElementById('charCount');
                inputWrap.classList.remove('recording');
                inputWrap.classList.add('cancel-mode');
                charCount.classList.remove('recording');
                charCount.classList.add('cancel-mode');
                showVoiceTip('松开取消', true);
            }
        } else {
            if (isCancelMode) {
                isCancelMode = false;
                const inputWrap = document.getElementById('inputWrap');
                const charCount = document.getElementById('charCount');
                inputWrap.classList.remove('cancel-mode');
                inputWrap.classList.add('recording');
                charCount.classList.remove('cancel-mode');
                charCount.classList.add('recording');
                showVoiceTip('请说话...', false);
            }
        }
    }

    function onPointerUp(e) {
        clearTimeout(longPressTimer);
        longPressTimer = null;

        const elapsed = Date.now() - pressStartTime;

        if (elapsed < LONG_PRESS_MS) {
            // 短按 = 点击识别（原有点击模式）
            onClickVoiceInput();
        } else if (isRecording) {
            // 长按结束 = 发送
            finishVoiceRecognition();
        }
    }

    // ================================================================
    // 点击识别（短按）
    // ================================================================
    function onClickVoiceInput() {
        if (!isVoiceMode) return;
        if (isListening) {
            stopVoice();
            const input = document.getElementById('chatInput');
            input.value = '';
            input.placeholder = '按住说话，或点击输入框开始识别';
            updateCharCount();
            return;
        }
        // 点击 = 开始识别（松手不发送，等下一次点击结束）
        startVoiceRecognition(false);
    }

    // ================================================================
    // 消息渲染
    // ================================================================
    function renderHistory() {
        const container = document.getElementById('chatHistoryList');
        if (historyData.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px;">暂无对话记录</div>';
            return;
        }
        container.innerHTML = historyData.map(item => `
            <div class="chat-history-item ${item.id === state.currentChatId ? 'active' : ''}" onclick="loadHistory('${item.id}')">
                <div class="title">${item.title}</div>
                <div class="meta">
                    <span>${item.preview}</span>
                    <span class="tag">${item.tag}</span>
                </div>
                <div class="meta" style="margin-top:2px;"><span>${item.time}</span></div>
            </div>
        `).join('');
    }

    function loadHistory(id) {
        const item = historyData.find(h => h.id === id);
        if (!item) return;
        state.currentChatId = id;
        renderHistory();
        document.getElementById('chatTitle').textContent = item.title;
        document.getElementById('chatSubtitle').textContent = '加载历史对话 · ' + item.time;
        const list = document.getElementById('messagesList');
        list.innerHTML = '';
        document.getElementById('emptyState').style.display = 'none';
        appendMessage({ role: 'user', text: item.title, time: item.time });
        appendMessage({ role: 'ai', text: item.preview, time: item.time });
    }

    function newChat() {
        state.currentChatId = null;
        renderHistory();
        document.getElementById('chatTitle').textContent = 'AI 经营助手';
        document.getElementById('chatSubtitle').textContent = '基于 DeepSeek · 33 种指令可用';
        document.getElementById('messagesList').innerHTML = '';
        document.getElementById('emptyState').style.display = 'flex';
        document.getElementById('chatInput').value = '';
        updateCharCount();
        document.getElementById('chatInput').focus();
    }

    function appendMessage(msg) {
        const list = document.getElementById('messagesList');
        const empty = document.getElementById('emptyState');
        if (empty) empty.style.display = 'none';

        const div = document.createElement('div');
        div.className = `message ${msg.role}`;
        const avatarIcon = msg.role === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
        const avatarClass = msg.role === 'user' ? 'user' : 'ai';

        let bubbleContent = `<div class="bubble">`;
        if (msg.text) bubbleContent += `<p>${msg.text.replace(/\n/g, '<br>')}</p>`;
        if (msg.card) {
            bubbleContent += `
                <div class="action-card">
                    <div class="title">${msg.card.title}</div>
                    <div class="desc">${msg.card.desc.replace(/\n/g, '<br>')}</div>
                    <div class="btn-group">
                        ${msg.card.actions.map(a => {
                            const cls = a.type === 'confirm' ? 'success' : a.type === 'cancel' ? 'outline' : a.type === 'danger' ? 'danger' : 'primary';
                            return `<span class="btn-sm ${cls}" onclick="${a.onclick}">${a.label}</span>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        bubbleContent += `<span class="time">${msg.time || new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}</span>`;
        bubbleContent += `</div>`;

        div.innerHTML = `<div class="avatar ${avatarClass}">${avatarIcon}</div>${bubbleContent}`;
        list.appendChild(div);
        const container = document.getElementById('messageContainer');
        setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
    }

                headers: { 'Content-Type': 'application/json' },

                        title: card.title,
                        desc: card.desc,

                            { label: confirmLabel, type: confirmType, onclick: 'confirmAction()' },
                            { label: '✖ 取消', type: 'cancel', onclick: 'cancelAction()' }
                        ]
                    }
                });
            }

            historyData.unshift({
                id: 'h' + Date.now(),
                title: text.length > 20 ? text.slice(0, 20) + '...' : text,

            });
            if (historyData.length > 20) historyData.pop();

        } catch (err) {

        }

        document.getElementById('sendBtn').disabled = false;

    async function confirmAction() {
        if (!state.pendingAction) {
            showToast('⚠️ 没有待执行的操作');
            return;
        }
        const action = state.pendingAction;
        state.pendingAction = null;

        showToast('⏳ 正在执行...');

        try {
            const res = await fetch(BACKEND_URL + '/api/ai/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: action.type, args: action.args })
            });
            const data = await res.json();

            if (data.success) {
                appendMessage({ role: 'ai', text: '✅ ' + data.message, time: nowTime() });
                if (data.csv) {
                    window.open(BACKEND_URL + '/api/export/csv', '_blank');
                }
            } else {
                appendMessage({ role: 'ai', text: '❌ ' + data.message, time: nowTime() });
            }
        } catch (err) {
            appendMessage({ role: 'ai', text: '❌ 执行失败：' + err.message, time: nowTime() });
        }
    }

    function cancelAction() {
        state.pendingAction = null;
        appendMessage({ role: 'ai', text: '好的，已取消该操作。', time: nowTime() });
    }

    function nowTime() {
        const d = new Date();
        return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }

    function exportChat() {
        const msgs = document.querySelectorAll('#messagesList .message');
        if (msgs.length === 0) { showToast('⚠️ 暂无对话可导出'); return; }
        let text = '智控电商 · AI助手对话记录\n' + '='.repeat(50) + '\n';
        msgs.forEach(m => {
            const role = m.classList.contains('user') ? '用户' : 'AI助手';
            const bubble = m.querySelector('.bubble');
            const content = bubble ? bubble.textContent.replace(/\d{2}:\d{2}/, '').trim() : '';
            text += `[${role}] ${content}\n`;
        });
        text += '='.repeat(50) + '\n导出时间: ' + new Date().toLocaleString();
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'AI助手对话记录_' + new Date().toISOString().slice(0,10) + '.txt';
        a.click();
        URL.revokeObjectURL(a.href);
        showToast('📥 对话已导出');
    }

    function showToast(msg) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#0a1e2f;color:white;padding:12px 28px;border-radius:40px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,0.15);z-index:9999;white-space:nowrap;display:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;`;
            document.body.appendChild(toast);
        }
        toast.innerHTML = msg;
        toast.style.display = 'block';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        updateCharCount();
    }

    function updateCharCount() {
        const input = document.getElementById('chatInput');
        const count = document.getElementById('charCount');
        const len = input.value.length;
        if (isRecording) {
            count.textContent = '录音中...';
        } else if (len === 0) {
            count.textContent = '0/500';
        } else {
            count.textContent = len + '/500';
            count.style.color = len > 450 ? '#b51a3f' : '#94a3b8';
        }
    }

    function handleKeyDown(e) {
        if (isVoiceMode) {
            e.preventDefault();
            return;
        }
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    // ================================================================
    // 初始化
    // ================================================================
    document.addEventListener('DOMContentLoaded', function() {
        renderHistory();
        document.getElementById('chatInput').focus();
        document.getElementById('messageContainer').addEventListener('click', () => {
            if (!isVoiceMode) document.getElementById('chatInput').focus();
        });

        // 绑定输入框的长按/滑动/松开事件（用于语音）
        const inputWrap = document.getElementById('inputWrap');
        inputWrap.addEventListener('pointerdown', onPointerDown);
        inputWrap.addEventListener('pointermove', onPointerMove);
        inputWrap.addEventListener('pointerup', onPointerUp);
        inputWrap.addEventListener('pointercancel', onPointerUp);
        inputWrap.addEventListener('pointerleave', function(e) {
            if (isRecording) onPointerUp(e);
        });
    });

    console.log('🤖 智控电商 · AI助手已加载（33种指令 + 长按录音）');
    console.log('💡 后端:', BACKEND_URL);
</script>
</body>
</html>
